rules:
  - id: securelintpro.hardcoded.secret
    message: "Hardcoded secret detected. Extract to an environment variable."
    severity: WARNING
    languages: [javascript, typescript, python]

    # Match common assignments in JS/TS/Python (single or double quotes)
    pattern-either:
      - pattern: const $X = "$S";
      - pattern: const $X = '$S';
      - pattern: let $X = "$S";
      - pattern: let $X = '$S';
      - pattern: var $X = "$S";
      - pattern: var $X = '$S';
      - pattern: $X = "$S"
      - pattern: $X = '$S'

      # Fallback: any assignment with a long quoted token (very permissive)
      - pattern-regex: "=\\s*['\\\"][A-Za-z0-9_\\-\\+/=]{16,}['\\\"]"

    # Ensure the secret-looking token is long enough
    metavariable-regex:
      metavariable: $S
      regex: "[A-Za-z0-9_\\-\\+/=]{16,}"
